name: chumkosoft

# Local development infrastructure for chumkosoft:
#   - postgres: primary database (Prisma)
#   - redis:    cache / sessions / queues
#   - minio:    S3-compatible object storage (uploads, documents)
#
# Start with:  docker compose up -d
# Credentials come from .env in this directory.

services:
  postgres:
    image: postgres:17-alpine
    container_name: chumkosoft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chumkosoft-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: chumkosoft-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations and (best-effort) seeds dev data.
  # Runs from the build stage that still has the Prisma CLI and dev deps.
  migrate:
    build:
      context: .
      target: builder
    container_name: chumkosoft-migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && (npx prisma db seed || echo 'seed skipped')"

  # The Next.js app (standalone build). Talks to infra over the compose network,
  # so DB/Redis/MinIO hosts are the service names, not localhost.
  app:
    build:
      context: .
      target: runner
    container_name: chumkosoft-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Uploads go over the compose network to `minio`; presigned image URLs are
      # signed for the host-reachable endpoint so the browser can load them.
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: "9000"
      MINIO_PUBLIC_USE_SSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Cloudflare Tunnel — exposes the app on a public HTTPS URL without opening a
  # port or a static IP. Needed for LINE OA webhooks (public HTTPS callback) and
  # for reaching the app off-network. Opt-in: only starts under the "tunnel"
  # profile, so a plain `docker compose up` is unaffected.
  #
  # Setup (one time):
  #   1. Cloudflare Zero Trust → Networks → Tunnels → Create a tunnel (Cloudflared).
  #   2. Add a Public Hostname → Service = HTTP → URL = app:3000
  #      (cloudflared shares this compose network, so it resolves the "app" host).
  #   3. Copy the tunnel token into .env as CLOUDFLARE_TUNNEL_TOKEN, and set
  #      APP_ALLOWED_ORIGINS to that public hostname (so Server Actions aren't blocked).
  #   4. Rebuild the app (APP_ALLOWED_ORIGINS is read at build) and start:
  #        docker compose --profile tunnel up -d --build
  #   5. Point the LINE Messaging API webhook at https://<hostname>/api/line/webhook.
  #
  # Quick throwaway URL for testing (no account, random *.trycloudflare.com, changes
  # each run): docker compose run --rm cloudflared tunnel --url http://app:3000
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: chumkosoft-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

  # One-shot: waits for MinIO, then creates the app bucket.
  minio-setup:
    image: minio/mc:latest
    container_name: chumkosoft-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/${MINIO_BUCKET};
      echo 'minio bucket ready: ${MINIO_BUCKET}';
      "

volumes:
  pg_data:
  redis_data:
  minio_data:
