name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://chumko:chumko@127.0.0.1:5432/chumkosoft?schema=public

      - name: Check lint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit --incremental false

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: validate
    runs-on: [self-hosted, linux, x64, chumkosoft-prod]
    timeout-minutes: 45
    permissions: {}
    concurrency:
      group: chumkosoft-production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy on the Ubuntu server
        run: sudo -n /usr/local/sbin/chumkosoft-deploy

  line-rich-menu:
    name: Publish LINE rich menu
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Publish the leave menu
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo 'LINE_CHANNEL_ACCESS_TOKEN secret is not configured; rich menu publication skipped.'
            exit 0
          fi
          python3 scripts/publish-line-rich-menu.py
